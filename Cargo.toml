[package]
name = "nzbff"
version = "3.26.0"
edition = "2021"
description = "NZB FF Tool Pro : renommage au format des indexers, rapport MediaInfo, envoi vers le logiciel de post"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "nzbff"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
